services:
  - type: web
    name: flasher-workshop
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: DEV_MODE
        value: "false"
      - key: APP_MODE
        value: REAL
      - key: ADMIN_IDS
        value: "7674443928"
      - key: BOT_TOKEN
        sync: false
